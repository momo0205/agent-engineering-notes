name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install --global npm@11.8.0
      - name: Install dependencies
        run: npm ci --verbose --no-audit --no-fund
      - name: Print npm diagnostic log
        if: failure()
        run: |
          for log in "$HOME"/.npm/_logs/*-debug-0.log; do
            test -f "$log" || continue
            tail -n 300 "$log" | sed -E 's#(authToken|authorization|password)[^[:space:]]*#\1=[REDACTED]#Ig'
          done
      - run: npm run verify
